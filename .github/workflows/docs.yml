name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the build to the permanent OSS Pages project
        required: false
        default: false
        type: boolean
      project_name:
        description: Permanent Cloudflare Pages project name
        required: false
        default: seekite-docs
        type: string

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and optionally deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: apps/docs/.seekite/cache
          key: docs-embeddings-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'apps/docs/search.config.ts', 'packages/embeddings-ternlight/src/**') }}
          restore-keys: |
            docs-embeddings-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seekite/docs test
      - run: pnpm docs:build
      - run: pnpm --filter @seekite/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @seekite/docs test:e2e

      - name: Upload static docs
        uses: actions/upload-artifact@v4
        with:
          name: seekite-docs
          path: apps/docs/dist/client
          if-no-files-found: error

      - name: Deploy Cloudflare Pages
        # Keep the permanent OSS project separate from temporary preview deployments.
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy &&
          github.ref == 'refs/heads/main' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/docs/dist/client
            --project-name=${{ inputs.project_name }}
            --branch=main
