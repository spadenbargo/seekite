name: Docs CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore embedding cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/docs/.seekite/cache
          key: docs-embeddings-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'apps/docs/search.config.ts', 'packages/embeddings-ternlight/src/**') }}
          restore-keys: |
            docs-embeddings-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seekite/docs test
      - run: pnpm docs:build
      - run: pnpm --filter @seekite/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @seekite/docs test:e2e

      - name: Upload verified static docs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: seekite-docs
          path: apps/docs/dist/client
          if-no-files-found: error
          retention-days: 7
